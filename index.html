<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="龙脊少年 · 守约 —— 中世纪奇幻文字冒险与卡牌对战" />
  <title>龙脊少年 · 守约</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- 顶部状态栏 -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="game-mark">守约</span>
        <span class="seed-label">种子</span>
        <code id="seed-display" class="seed-value">—</code>
      </div>
      <div class="topbar-center">
        <div class="chapter-progress">
          <span id="chapter-title">—</span>
          <div class="progress-track"><i id="progress-fill"></i></div>
        </div>
      </div>
      <div class="topbar-right">
        <span class="meta-label">回合</span>
        <code id="turn-display" class="meta-value">0</code>
        <span class="meta-label">层数</span>
        <code id="floor-display" class="meta-value">0</code>
      </div>
    </header>

    <!-- 主菜单视图 -->
    <section id="view-menu" class="view view-menu is-active">
      <div id="menu-embers" class="menu-embers"></div>
      <div class="menu-card">
        <p class="menu-eyebrow">中世纪 · 宗教 · 龙族 · 飞行与远洋</p>
        <h1 class="menu-title">龙脊少年</h1>
        <p class="menu-sub">守约</p>
        <p class="menu-blurb">
          家园焚于龙焰,幼弟被掳作「火种」。你握起父亲的旧剑——剑名「守约」。<br />
          这一路,你将在剑、星图、风翼、盐风与信仰之间,决定你想成为谁。
        </p>
        <div class="menu-actions">
          <button id="btn-new-run" class="btn btn-primary">启 程</button>
          <button id="btn-seed-run" class="btn btn-ghost">指定种子</button>
        </div>
        <p class="menu-hint">文字冒险 + 卡牌对战 · 6 职业 / 15 章 / 4 结局</p>
      </div>
    </section>

    <!-- 职业选择视图(初始职业已改为剧情自动分配,此视图保留供扩展) -->
    <section id="view-career" class="view view-career">
      <h2 class="view-title">选择你的少年</h2>
      <p class="view-sub">六位少年,六种命运。选择将决定你的卡组与成长。</p>
      <div id="career-grid" class="career-grid"></div>
    </section>

    <!-- 剧情视图 -->
    <section id="view-narrative" class="view view-narrative">
      <!-- 左:人物状态 / 服饰 / 装扮(像素图) -->
      <aside id="scene-character" class="scene-panel scene-character" aria-hidden="true">
        <div class="scene-panel-title">人 物</div>
        <div class="scene-frame">
          <canvas id="scene-char-canvas" class="scene-canvas scene-canvas-char" width="96" height="120"></canvas>
          <span class="scene-corner tl"></span><span class="scene-corner tr"></span>
          <span class="scene-corner bl"></span><span class="scene-corner br"></span>
        </div>
        <div id="scene-char-name" class="scene-name">—</div>
        <div id="scene-char-outfit" class="scene-sub">—</div>
        <div id="scene-char-status" class="scene-status"></div>
      </aside>

      <div class="narrative-box">
        <div class="narrative-head">
          <div id="narrative-stats" class="narrative-stats"></div>
          <div id="narrative-vitals" class="narrative-vitals"></div>
        </div>
        <div id="narrative-text" class="narrative-text"></div>
        <div id="narrative-choices" class="narrative-choices"></div>
        <div class="narrative-footer">
          <span id="narrative-hint" class="narrative-hint"></span>
        </div>
      </div>

      <!-- 右:所处位置 / 环境(像素图) -->
      <aside id="scene-env" class="scene-panel scene-env" aria-hidden="true">
        <div class="scene-panel-title">环 境</div>
        <div class="scene-frame">
          <canvas id="scene-env-canvas" class="scene-canvas scene-canvas-env" width="176" height="112"></canvas>
          <span class="scene-corner tl"></span><span class="scene-corner tr"></span>
          <span class="scene-corner bl"></span><span class="scene-corner br"></span>
        </div>
        <div id="scene-env-name" class="scene-name">—</div>
        <div id="scene-env-desc" class="scene-sub">—</div>
      </aside>
    </section>

    <!-- 地图视图 -->
    <section id="view-map" class="view view-map">
      <h2 class="view-title">选择路径</h2>
      <div id="map-nodes" class="map-nodes"></div>
    </section>

    <!-- 战斗视图 -->
    <section id="view-battle" class="view view-battle">
      <div class="battle-stage">
        <div class="battle-foes">
          <div id="enemy-zone" class="enemy-zone"></div>
        </div>
        <div id="battle-log" class="battle-log"></div>
        <div class="battle-hero">
          <div id="player-zone" class="player-zone"></div>
        </div>
      </div>
      <div class="battle-hud">
        <div class="hud-piles">
          <span class="pile">抽牌堆 <code id="draw-count">0</code></span>
          <span class="pile">弃牌堆 <code id="discard-count">0</code></span>
        </div>
        <div class="hud-energy">
          <span id="energy-display" class="energy-orb">0/0</span>
        </div>
      </div>
      <div id="hand" class="hand"></div>
      <div class="battle-actions">
        <button id="btn-end-turn" class="btn btn-primary">结束回合</button>
      </div>
    </section>

    <!-- 战利品视图 -->
    <section id="view-reward" class="view view-reward">
      <h2 class="view-title">战 利 品</h2>
      <p class="view-sub">从战场上拾起一张卡牌,加入你的牌组</p>
      <div id="reward-grid" class="reward-grid"></div>
      <button id="btn-skip-reward" class="btn btn-ghost">放 弃</button>
    </section>

    <!-- 结算视图 -->
    <section id="view-result" class="view view-result">
      <div class="result-card">
        <p id="result-eyebrow" class="result-eyebrow">结 局</p>
        <h2 id="result-title" class="result-title">—</h2>
        <div class="result-art"></div>
        <p id="result-desc" class="result-desc"></p>
        <div id="result-stats" class="result-stats"></div>
        <button id="btn-restart" class="btn btn-primary">再 来 一 局</button>
      </div>
    </section>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
